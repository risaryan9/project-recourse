# Grievance contacts of major Indian banks, for addressing complaint emails.
#
# Rules (CLAUDE.md §3 "Bank contacts file"):
# - Values come ONLY from the bank's own official website; `source_urls` lists the pages read.
# - Every entry starts `verified: false`. A maintainer flips it after checking the live page.
#   Real (non-sandbox) sending is refused for unverified entries (ADR-012).
# - `null` means "not found on the official pages read" (never guessed). `notes` says why.
# - `sender_domains`: no bank states its sending domains, so these are the domains of the
#   official contact addresses listed here (`sender_domains_basis: contact_emails`). Banks
#   moved to the RBI-mandated `.bank.in` domain in 2025; old domains redirect there.
# - `bank_type`: the RBI category. All ten listed banks are scheduled commercial banks
#   (public or private sector); covered by `verified` like every other value.
# - Researched 2026-11-19.

