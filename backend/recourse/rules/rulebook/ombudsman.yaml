# Escalation to the RBI Ombudsman under the Reserve Bank – Integrated Ombudsman Scheme, 2026.
#
# The scheme applies to complaints made to the RBI Ombudsman on/after 2026-07-01. Complaints
# received before that date stay under RB-IOS 2021, which is not in this rulebook.
#
# Every value has a `source` with exact quotes; a test checks each quote against the local PDF.

scheme:
  id: RBIOS-2026
  name: Reserve Bank – Integrated Ombudsman Scheme, 2026
  doc: RBI-IOS-2026
  effective_from: 2026-07-01
  effective_to: null
  verified: false
  effective_source:
    para: "clause 1(2), clause 20"
    quotes:
      - "It shall come into force with effect from July 1, 2026."
      - "received before July 01, 2026"

  complain_to_bank_first:
    para: "clause 10(1)(e)"
    quotes:
      - "the Complainant had first made a complaint in writing or through any other mode to the Regulated Entity concerned"

  # Waiting period: no reply within the HIGHER of 30 days and any RBI / NPCI / card-network
  # timeline, counted from the date the bank received the complaint. A complainant who is not
  # satisfied with the bank's reply can escalate without waiting for the period to end.
  min_wait_days: 30
  wait_source:
    para: "clause 10(1)(f)"
    quotes:
      - "the Complainant has not received any reply within 30 days or within the time specified by the Reserve Bank, National Payments Corporation of India, or under Card Network guidelines, if any, whichever is higher after the Regulated Entity received the complaint; or the Complainant is not satisfied with the reply / resolution provided by the Regulated Entity"

  # Filing window: 90 days from the LATER of (end of the waiting period) and (the bank's last
  # communication).
  filing_window_days: 90
  filing_source:
    para: "clause 10(1)(g)"
    quotes:
      - "the complaint is made to the RBI Ombudsman within 90 days from the date on which the timeline specified in sub-clause (1)(f) expires or the date of the last communication from the concerned Regulated Entity, whichever is later"

  no_advocate:
    para: "clause 10(1)(b)"
    quotes:
      - "the complaint is lodged by the Complainant personally or through an authorised representative other than an advocate unless the advocate is the aggrieved person"

  limitation_act:
    para: "clause 10(1)(l)"
    quotes:
      - "the complaint to the Regulated Entity was made before the expiry of the period of limitation prescribed under the Limitation Act, 1963, for such claims."

  compensation_caps:
    consequential_loss_max_inr: 3000000
    harassment_max_inr: 300000
    source:
      para: "clause 8(3)"
      quotes:
        - "There is no limit on the amount in a dispute that can be brought before the RBI Ombudsman"
        - "for any consequential loss suffered by the Complainant, the RBI Ombudsman shall have the power to provide a compensation up to ₹30 lakh."
        - "the RBI Ombudsman shall also have the power to provide a compensation up to ₹3 lakh for the loss of the Complainant’s time, expenses incurred, harassment/mental anguish suffered, etc."

  award_acceptance_days: 30
  award_acceptance_source:
    para: "clause 15(4)"
    quotes:
      - "within a period of 30 days from the date of receipt of the copy of the Award."

  appeal_days: 30
  appeal_source:
    para: "clause 17(3)"
    quotes:
      - "The Complainant may, aggrieved by an Award under clause 15(1), within 30 days of the date of receipt of the Award, prefer an appeal before the Appellate Authority."

  filing_channels:
    portal_url: https://cms.rbi.org.in
    email: crpc@rbi.org.in
    postal_address: >-
      Centralised Receipt and Processing Centre (CRPC), Reserve Bank of India, 4th Floor,
      Sector 17, Central Vista, Chandigarh - 160017
    source:
      para: "clause 6(2), clause 11, Annex Part A item 6"
      quotes:
        - "The complaints under the Scheme made online shall be registered on the portal (https://cms.rbi.org.in)."
        - "crpc@rbi.org.in"
        - "Centralised Receipt and Processing Centre, 4th Floor, Reserve Bank of India, Sector -17, Central"

  # Which regulated entities the scheme covers. Co-operative banks and NBFCs are covered only
  # above size thresholds (or for specific types) the engine cannot check, so they are CONDITIONAL.
  covered_entities:
    covered: [COMMERCIAL_BANK, SMALL_FINANCE_BANK, PAYMENTS_BANK, LOCAL_AREA_BANK, REGIONAL_RURAL_BANK, NON_BANK_PPI_ISSUER]
    conditional: [COOPERATIVE_BANK, NBFC]
    source:
      para: "clause 1(3)"
      quotes:
        - "all Commercial Banks, Regional Rural Banks, State Co-operative Banks, Central Co-operative Banks, Scheduled Primary (Urban) Co-operative Banks, and Non-Scheduled Primary (Urban) Co-operative Banks with deposits size of ₹50 crore and above"
        - "all Non-bank Prepaid Payment Instruments Issuers."
        - "have customer interface, with an assets size of ₹100 crore and above"
