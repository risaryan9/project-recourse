# Alembic configuration. The database URL is NOT stored here: migrations/env.py reads
# DATABASE_URL from settings (.env), unless a caller sets sqlalchemy.url programmatically.
#   uv run alembic upgrade head        # apply all migrations to DATABASE_URL (Neon dev branch)
#   uv run alembic downgrade -1        # undo the latest migration
#   uv run alembic revision -m "..."   # new migration file (review before applying)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
