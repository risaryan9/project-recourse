[project]
name = "recourse"
version = "0.1.0"
description = "Agentic assistant that helps Indian bank/UPI customers recover money they are owed under RBI rules."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "fastapi[standard]>=0.163.1",
    "langgraph>=1.2.22",
    "openai>=3.51.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "temporalio>=1.36.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recourse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Database tests hit the Neon "test" branch: opt in with `uv run pytest -m db`.
addopts = "-m 'not db'"
markers = ["db: needs TEST_DATABASE_URL (Neon test branch); run with -m db"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
